name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 语法门禁：任何 .ps1 有语法错误都不允许往下打包
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax check
        shell: pwsh
        run: ./tools/ps/Test-Syntax.ps1

      - name: Unit tests (transition rules)
        shell: pwsh
        run: ./tools/ps/Test-Transition.ps1

  build-exe:
    needs: syntax-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build single-file exe (no Node.js required)
        shell: pwsh
        run: |
          # runner 上 PSGallery 可能未注册；失败也不中断 ——
          # Build-Exe.ps1 内部会在缺少 ps2exe 时自行安装
          try {
            if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default -ErrorAction SilentlyContinue
            }
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          } catch { }
          ./tools/ps/Build-Exe.ps1 -OutputDir dist

      - name: Show artifact
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: AuraScreensaver-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
